name: Build Windows client
on:
  workflow_dispatch: {}
  push:
    paths: ['alerting_client.py', 'icon_16x16.ico', 'icon_32x32.ico', 'icon_48x48.ico', '.github/workflows/build-windows-client.yml']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller
      - name: Build exe
        shell: pwsh
        run: |
          $opts = @('--onefile', '--noconsole', '--name', 'AlertingClient')
          
          if (Test-Path 'icon_32x32.ico') {
            $opts += @('--icon', 'icon_32x32.ico')
          }
          
          pyinstaller @opts alerting_client.py
      - uses: actions/upload-artifact@v4
        with:
          name: AlertingClient
          path: dist/AlertingClient.exe