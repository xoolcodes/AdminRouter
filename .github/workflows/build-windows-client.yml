name: Build Windows client
on:
  workflow_dispatch: {}
  push:
    paths: ['alerting_client.py', 'make_icons.py', 'WINDOWSICON.jfif', '.github/workflows/build-windows-client.yml']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pillow
      - name: Build exe
        shell: pwsh
        run: |
          $opts = @('--onefile', '--noconsole', '--name', 'AlertingClient')
          if (Test-Path 'WINDOWSICON.jfif') {
            python make_icons.py
            $opts += @('--icon', 'icon.ico', '--add-data', 'icon.ico;.', '--add-data', 'icon.png;.')
          }
          pyinstaller @opts alerting_client.py
      - uses: actions/upload-artifact@v4
        with:
          name: AlertingClient
          path: dist/AlertingClient.exe