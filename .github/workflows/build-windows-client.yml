name: Build Windows client
on:
  workflow_dispatch: {}
  push:
    paths: ['alerting_client.py', 'icon_16x16.ico', 'icon_32x32.ico', 'icon_48x48.ico', '.github/workflows/build-windows-client.yml']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pillow
      - name: Build exe
        shell: pwsh
        run: |
          $opts = @('--onefile', '--noconsole', '--name', 'AlertingClient')
          
          # Combine multiple sizes into a single proper multi-res .ico for PyInstaller
          if ((Test-Path 'icon_16x16.ico') -and (Test-Path 'icon_32x32.ico') -and (Test-Path 'icon_48x48.ico')) {
            python -c "
            from PIL import Image
            img16 = Image.open('icon_16x16.ico')
            img32 = Image.open('icon_32x32.ico')
            img48 = Image.open('icon_48x48.ico')
            img48.save('combined_icon.ico', format='ICO', append_images=[img32, img16])
            "
            $opts += @('--icon', 'combined_icon.ico')
          }
          
          pyinstaller @opts alerting_client.py
      - uses: actions/upload-artifact@v4
        with:
          name: AlertingClient
          path: dist/AlertingClient.exe