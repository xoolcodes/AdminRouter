name: Build Windows alerting client

on:
  workflow_dispatch:
  push:
    paths:
      - "remote_alerting_client.py"
      - "build_windows_client.cmd"
      - ".github/workflows/build-windows-client.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build executable
        run: |
          python -m pip install --upgrade pyinstaller pillow
          python -c "from PIL import Image; Image.open('WINDOWSICON.jfif').convert('RGBA').save('windowsicon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(256,256)])"
          pyinstaller --noconfirm --clean --onefile --windowed --icon windowsicon.ico --name AdminRouterAlertingClient remote_alerting_client.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: AdminRouterAlertingClient-windows
          path: dist/AdminRouterAlertingClient.exe
